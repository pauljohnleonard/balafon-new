<ng-container>
  <mat-toolbar>
    <button mat-icon-button routerLink="/home" matTooltip="Home">
      <mat-icon>home</mat-icon>
    </button>

    <button *ngIf="showBack" mat-icon-button (click)="back.emit()">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <span style="flex: 1 1 auto"></span>
    <balafon-transport></balafon-transport>

    <span style="flex: 1 1 auto"></span>
    <ng-container *ngIf="user">
      <button
        class="avatar-button"
        type="button"
        (click)="auth.logout()"
        matTooltip="Logout"
      >
        <img
          *ngIf="avatarUrl && !avatarFailed"
          class="avatar"
          [src]="avatarUrl"
          referrerpolicy="no-referrer"
          alt=""
          (error)="avatarFailed = true"
        />
        <mat-icon *ngIf="!avatarUrl || avatarFailed">account_circle</mat-icon>
      </button>
    </ng-container>

    <ng-container *ngIf="!user">
      <button
        mat-raised-button
        color="primary"
        (click)="loginWithGoogle()"
        matTooltip="Login with Google"
      >
        <mat-icon>login</mat-icon>
        Login with Google
      </button>
    </ng-container>
  </mat-toolbar>

  <mat-divider> </mat-divider>
  <mat-progress-bar
    *ngIf="
      !balafonService.ready$.value || (ensembleService.ready$ | async) === false
    "
    mode="determinate"
    [value]="progressPercent"
  ></mat-progress-bar>
</ng-container>
