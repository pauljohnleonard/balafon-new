<div class="transport" *ngIf="ensembleService.ensemble">
  <div class="transport-row">
    <button mat-icon-button class="btn1" (click)="ensembleService.play()">
      <mat-icon>
        {{ this.ensembleService.playing ? 'stop' : 'play_arrow' }}
      </mat-icon>
    </button>

    <mat-slider max="180" min="40" step="1">
      <input
        [value]="ensembleService.ensemble.bpm"
        matSliderThumb
        (valueChange)="metroChange($event)"
      />
    </mat-slider>

    <img src="assets/images/crochet.png" alt="crochet" class="note" />
    <div class="bpm">{{ ensembleService.ensemble.bpm }}</div>
  </div>
</div>
