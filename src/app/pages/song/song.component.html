<balafon-toolbar [showBack]="showBack" (back)="goBack()"> </balafon-toolbar>
<div class="song-page" *ngIf="ensemble">
  <mat-toolbar class="song-bar">
    <input
      class="plain-field title"
      type="text"
      [formControl]="title"
      matTooltip="Edit title"
    />

    <span class="spacer"></span>

    <input class="plain-field count-in" type="text" [formControl]="countIn" />

    <button
      mat-icon-button
      (click)="clone()"
      matTooltip="Clone"
      *ngIf="ensemble?.key"
    >
      <mat-icon>content_copy</mat-icon>
    </button>

    <button
      mat-icon-button
      (click)="saveItem()"
      matTooltip="Save to cloud"
      *ngIf="canSave()"
    >
      <mat-icon>cloud_upload</mat-icon>
    </button>
  </mat-toolbar>

  <div class="balafon-container">
    <ng-container *ngFor="let pattern of ensemble.patterns">
      <balafon-app [ensembleComponent]="this" [pattern]="pattern"></balafon-app>
    </ng-container>

    <button mat-icon-button (click)="addBalafon()" matTooltip="Add looper">
      <mat-icon>add_circle</mat-icon>
    </button>
  </div>
</div>
